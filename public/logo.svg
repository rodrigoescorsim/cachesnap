<svg viewBox="0 0 310 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CacheSnap">
  <defs>

    <filter id="glowSymbol" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feComponentTransfer in="blur" result="gb">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="gb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSnap" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur stdDeviation="0.55" result="blur"/>
      <feComponentTransfer in="blur" result="dimBlur">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Fundo dark -->
  <rect width="310" height="80" fill="#0B1220"/>

  <!-- SÍMBOLO: margem esquerda 50→40 (-10px) -->
  <g transform="translate(40, 40)" filter="url(#glowSymbol)">

    <polygon
      points="0,-32.75 28.37,-16.38 28.37,16.38 0,32.75 -28.37,16.38 -28.37,-16.38"
      fill="none"
      stroke="#22FF88"
      stroke-width="1.52"
      stroke-linejoin="round"/>

    <polygon
      points="0,-26.66 23.09,-13.33 23.09,13.33 0,26.66 -23.09,13.33 -23.09,-13.33"
      fill="none"
      stroke="rgba(34,255,136,0.15)"
      stroke-width="0.6"
      stroke-linejoin="round"/>

    <polygon
      points="0,-17.52 17.52,-8.76 0,0 -17.52,-8.76"
      fill="rgba(34,255,136,0.14)"
      stroke="#22FF88"
      stroke-width="0.91"
      stroke-linejoin="round"/>
    <polygon
      points="17.52,-8.76 17.52,8.76 0,17.52 0,0"
      fill="rgba(34,255,136,0.07)"
      stroke="#22FF88"
      stroke-width="0.91"
      stroke-linejoin="round"/>
    <polygon
      points="-17.52,-8.76 0,0 0,17.52 -17.52,8.76"
      fill="rgba(34,255,136,0.20)"
      stroke="#22FF88"
      stroke-width="0.91"
      stroke-linejoin="round"/>

  </g>

  <!-- TEXTO: x=100→90 (-10px) -->
  <text
    x="90" y="52"
    font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif"
    font-size="45"
    letter-spacing="-0.5"
    fill="#FFFFFF"
    font-weight="600"
  >cache<tspan
      fill="#22FF88"
      font-weight="700"
      filter="url(#glowSnap)"
    >snap</tspan></text>

</svg>
