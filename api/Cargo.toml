[package]
name = "cachesnap-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Database (PostgreSQL / TimescaleDB)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Redis
deadpool-redis = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (para chamar CF Workers e webhooks)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config / env
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Scheduler (tokio-based cron)
tokio-cron-scheduler = "0.10"

# Password hashing (para auth compartilhada com Next.js)
argon2 = "0.5"

# HMAC-SHA256 for signed snooze tokens in alert emails
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
